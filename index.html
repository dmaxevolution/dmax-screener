<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDX Swing Trading Screener</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <div class="brand-container">
            <div class="brand-title">IDX TERMINAL</div>
            <div class="subtitle">Swing Trading Screener</div>
        </div>

        <div class="header-right">
            <div class="ihsg-compact-badge">
                <span class="label">IHSG</span>
                <span id="ihsg-val" class="value">-</span>
                <span id="ihsg-pct" class="pct">-</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Cari emiten..." oninput="filterStocks()">
                <button class="clear-search-btn" id="clear-search" onclick="clearSearchBox()">&times;</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Favorite Section (Pencarian/Blink dipindah ke sini) -->
        <section id="favorite-section">
            <div class="section-header">
                <h3>Emiten Favorit / Hasil Pencarian</h3>
                <button onclick="clearAllFavorites()" style="background:none; border:none; color:var(--red-bearish); font-size:10px; cursor:pointer;">Hapus Backup DB</button>
            </div>
            <div id="favorite-list" class="stocks-grid"></div>
        </section>

        <!-- Entry Signal Radar (Diposisikan di bawah Favorite) -->
        <section>
            <div class="section-header">
                <h3>Sinyal Setup Entry Swing</h3>
                <span class="badge-live">LIVE RADAR</span>
            </div>
            <div id="entry-list" class="entry-grid"></div>
        </section>

        <!-- Top 10 High Power Watchlist -->
        <section>
            <div class="section-header">
                <h3>Top 10 High Power Score</h3>
            </div>
            <div id="top10-grid" class="stocks-grid"></div>
        </section>

        <!-- All Stocks Grid -->
        <section style="margin-bottom: 40px;">
            <div class="section-header">
                <h3>Semua Emiten Pilihan BEI (<span id="total-emiten-count">0</span>)</h3>
            </div>
            <div id="all-stocks-grid" class="stocks-grid"></div>
        </section>
    </main>

    <!-- Modal Detail Emiten -->
    <div id="stock-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-ticker"></h2>
                    <span id="modal-sector" class="sector-badge"></span>
                </div>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <div id="modal-details"></div>
        </div>
    </div>

    <script src="indicators.js"></script>
    <script src="app.js"></script>
</body>
</html>
