<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screener Pro - Swing Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 750: '#2d3748', 850: '#1a202c', 950: '#0d1117' }
                    },
                    animation: {
                        'signal-blink': 'blink 1.2s infinite'
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: 0.3 }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen pb-10">

    <!-- Navbar Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="text-xl">🚀</span>
                <h1 class="text-lg font-black text-yellow-400 tracking-wider">SWING SCREENER</h1>
            </div>
            
            <!-- IHSG Widget -->
            <div class="flex items-center gap-3 bg-gray-950 px-3 py-1.5 rounded-lg border border-gray-800 text-xs">
                <span class="text-gray-400 font-bold">IHSG:</span>
                <span id="ihsg-header-close" class="font-bold text-white">0.00</span>
                <span id="ihsg-header-pct" class="font-bold text-green-400">0.00%</span>
            </div>

            <div class="text-[11px] text-gray-400">
                Updated: <span id="last-updated" class="text-gray-200 font-mono">-</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Search Bar Section -->
        <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex items-center gap-2 shadow-inner">
            <span class="text-gray-400 text-lg">🔍</span>
            <input type="text" id="search-input" onkeyup="if(event.key==='Enter') searchTicker(this.value)" placeholder="Cari emiten (misal: BBCA)... lalu tekan Enter" class="bg-transparent border-none text-sm text-white focus:outline-none w-full">
            <button onclick="searchTicker(document.getElementById('search-input').value)" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-4 py-1.5 rounded-lg text-xs transition">
                Cari
            </button>
        </div>

        <!-- Section Top 10 Best Entry -->
        <section class="bg-gray-900 border border-yellow-500/40 rounded-2xl p-4 shadow-xl">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-xl">⭐</span>
                <h2 class="text-base font-bold text-yellow-400 uppercase tracking-wide">Top 10 Best Entry Candidates</h2>
            </div>

            <!-- Table Top 10 Desktop -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-xs text-left text-gray-300">
                    <thead class="bg-gray-800 text-gray-400 uppercase border-b border-gray-700">
                        <tr>
                            <th class="py-2.5 px-3">Rank</th>
                            <th class="py-2.5 px-3">Ticker</th>
                            <th class="py-2.5 px-3">Close</th>
                            <th class="py-2.5 px-3">Chg %</th>
                            <th class="py-2.5 px-3 text-center">Signal Power</th>
                            <th class="py-2.5 px-3">Stop Loss</th>
                            <th class="py-2.5 px-3">Target TP</th>
                        </tr>
                    </thead>
                    <tbody id="top-10-data" class="divide-y divide-gray-800">
                        <!-- Data Top 10 Desktop dirender via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Container Top 10 Kartu Khusus HP (Gold Style) -->
            <div id="top-10-mobile-cards" class="grid grid-cols-1 gap-3 md:hidden">
                <!-- Data Top 10 HP dirender via JS -->
            </div>
        </section>

        <!-- Navigation Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800 scrollbar-none">
            <button onclick="switchTab('entry_now')" id="tab-entry_now" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-black bg-green-950 text-green-400 border border-green-500/50 hover:bg-green-900 transition flex items-center gap-1 whitespace-nowrap">
                ⚡ ENTRY NOW (<span id="count-entry_now">0</span>)
            </button>
            <button onclick="switchTab('swing_setup')" id="tab-swing_setup" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap">
                🎯 Swing Setup (<span id="count-swing_setup">0</span>)
            </button>
            <button onclick="switchTab('top_gainers')" id="tab-top_gainers" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap">
                🔥 Top Gainers (<span id="count-top_gainers">0</span>)
            </button>
            <button onclick="switchTab('bluechips')" id="tab-bluechips" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap">
                🏛️ Bluechip (<span id="count-bluechips">0</span>)
            </button>
            <button onclick="switchTab('pantauan')" id="tab-pantauan" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap">
                👁️ Watchlist (<span id="count-pantauan">0</span>)
            </button>
            <button onclick="switchTab('all_stocks')" id="tab-all_stocks" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap">
                📋 All Stocks (<span id="count-all_stocks">0</span>)
            </button>
        </div>

        <!-- Main Screener Data Section -->
        <section>
            <!-- Desktop Table view -->
            <div class="hidden md:block bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden shadow-lg">
                <table class="w-full text-xs text-left text-gray-300">
                    <thead class="bg-gray-800 text-gray-400 uppercase border-b border-gray-700">
                        <tr>
                            <th class="p-3">Ticker</th>
                            <th class="p-3">Harga</th>
                            <th class="p-3">Chg %</th>
                            <th class="p-3">EMA 20</th>
                            <th class="p-3">EMA 50</th>
                            <th class="p-3">RSI</th>
                            <th class="p-3 text-center">Signal Power</th>
                            <th class="p-3">Stop Loss</th>
                            <th class="p-3">Target TP</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="screener-data-desktop" class="divide-y divide-gray-800">
                        <!-- Data Desktop dirender via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Mobile Cards view -->
            <div id="screener-data-mobile" class="grid grid-cols-1 gap-3 md:hidden">
                <!-- Data Mobile Cards dirender via JS -->
            </div>
        </section>

    </main>

    <!-- JS Files Integration -->
    <script src="indicators.js"></script>
    <script src="render.js"></script>
    <script src="app.js"></script>
</body>
</html>
