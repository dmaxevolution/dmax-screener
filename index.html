<!-- Contoh Struktur Rendering Kartu JavaScript di index.html -->
<script>
function renderStockCards(stocks) {
  const container = document.getElementById('stock-container');
  container.innerHTML = '';

  stocks.forEach(stock => {
    // Penentuan Warna Badge Berdasarkan Sinyal
    let patternBadgeClass = "bg-secondary";
    if (stock.signal === 'BUY') patternBadgeClass = "bg-success";
    if (stock.signal === 'EXIT') patternBadgeClass = "bg-danger";

    const card = document.createElement('div');
    card.className = 'stock-card p-3 mb-3 border rounded shadow-sm';

    card.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="fw-bold m-0">${stock.ticker}</h5>
        <span class="fs-6 fw-bold">Rp ${stock.price.toLocaleString('id-ID')}</span>
      </div>

      <!-- Badge Candle Pattern -->
      <div class="mb-2">
        <span class="badge ${patternBadgeClass} text-white">
          Pola: ${stock.candle_pattern}
        </span>
      </div>

      <!-- Blok Informasi RRR & Trade Plan (Hanya Tampil Jika Sinyal BUY) -->
      ${stock.signal === 'BUY' ? `
        <div class="p-2 bg-light rounded border mb-2">
          <div class="d-flex justify-content-between text-sm">
            <span>Risk-to-Reward (RRR):</span>
            <strong class="${stock.valid_rrr ? 'text-success' : 'text-warning'}">
              1:${stock.rrr} ${stock.valid_rrr ? '✓ (Valid)' : '✗ (< 1:2)'}
            </strong>
          </div>
          <hr class="my-1">
          <div class="d-flex justify-content-between text-muted small">
            <span>SL: Rp ${stock.stop_loss}</span>
            <span>TP: Rp ${stock.take_profit}</span>
          </div>
        </div>
      ` : ''}

      <!-- Status Rekomendasi Akhir -->
      <div class="d-flex justify-content-between align-items-center mt-2">
        <small class="text-muted">RSI: ${stock.rsi}</small>
        <span class="fw-bold ${stock.overall_status === 'STRONG BUY' ? 'text-success' : 'text-dark'}">
          ${stock.overall_status}
        </span>
      </div>
    `;

    container.appendChild(card);
  });
}
</script>
