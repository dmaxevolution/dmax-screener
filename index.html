<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screener Saham - Price Action & RRR</title>
    
    <!-- Bootstrap 5 CSS (Framework Utama) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- File CSS Kustom Anda -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">📈 Stock Price Action Screener</span>
            <button class="btn btn-outline-light btn-sm px-3" onclick="loadScreenerData()">🔄 Refresh Data</button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        <!-- Sub-header & Ringkasan Info -->
        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <p class="text-muted mb-0 fw-medium" id="status-info">Memuat data screener...</p>
            </div>
        </div>

        <!-- Grid Container Kartu Saham -->
        <div class="row" id="stock-container">
            <!-- Kartu-kartu saham akan di-render secara otomatis oleh JS di sini -->
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        async function loadScreenerData() {
            const container = document.getElementById('stock-container');
            const statusInfo = document.getElementById('status-info');
            
            // Tampilan Loading Spinner
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Membaca data.json...</p>
                </div>`;

            try {
                // Mengambil data.json dengan timestamp cache-buster
                const response = await fetch('data.json?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error('File data.json tidak ditemukan atau gagal dimuat.');
                }

                const stocks = await response.json();

                if (!stocks || stocks.length === 0) {
                    container.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-warning text-center">Data kosong. Jalankan <code>python screener.py</code> terlebih dahulu.</div>
                        </div>`;
                    statusInfo.innerText = "Tidak ada saham yang ditemukan.";
                    return;
                }

                statusInfo.innerText = `Menampilkan ${stocks.length} emiten hasil screener`;
                container.innerHTML = ''; // Bersihkan loader

                // Render setiap kartu saham
                stocks.forEach(stock => {
                    const cardCol = document.createElement('div');
                    cardCol.className = 'col-md-6 col-lg-4 mb-4';

                    // Penentuan warna badge pola candlestick
                    let badgeClass = "bg-secondary";
                    if (stock.signal === 'BUY') badgeClass = "bg-success";
                    if (stock.signal === 'EXIT') badgeClass = "bg-danger";

                    // Penentuan warna badge status rekomendasi
                    let statusBadgeClass = "bg-light text-dark border";
                    if (stock.overall_status === 'STRONG BUY') statusBadgeClass = "bg-success text-white";
                    else if (stock.overall_status.includes('BUY')) statusBadgeClass = "bg-primary text-white";
                    else if (stock.overall_status.includes('EXIT')) statusBadgeClass = "bg-danger text-white";

                    cardCol.innerHTML = `
                        <div class="stock-card p-3 border shadow-sm h-100 d-flex flex-column justify-content-between">
                            <div>
                                <!-- Header Emiten & Harga -->
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h4 class="fw-bold m-0 text-dark">${stock.ticker}</h4>
                                    <span class="fs-5 fw-bold text-primary">Rp ${stock.price ? stock.price.toLocaleString('id-ID') : 0}</span>
                                </div>

                                <!-- Badge Pola Candlestick -->
                                <div class="mb-3">
                                    <span class="badge ${badgeClass} badge-pattern text-uppercase">
                                        Pola: ${stock.candle_pattern || 'NEUTRAL'}
                                    </span>
                                </div>

                                <!-- Box Trade Plan & RRR (Jika ada Sinyal BUY) -->
                                ${stock.signal === 'BUY' ? `
                                    <div class="trade-plan-box p-3 mb-3">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <small class="fw-semibold text-secondary">Risk-to-Reward (RRR):</small>
                                            <span class="fw-bold ${stock.valid_rrr ? 'text-success' : 'text-danger'}">
                                                1:${stock.rrr} ${stock.valid_rrr ? '✓ (Valid)' : '✗ (< 1:2)'}
                                            </span>
                                        </div>
                                        <hr class="my-1 border-secondary opacity-25">
                                        <div class="d-flex justify-content-between text-sm mt-2">
                                            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger opacity-75 px-2 py-1">
                                                SL: Rp ${stock.stop_loss ? stock.stop_loss.toLocaleString('id-ID') : 0}
                                            </span>
                                            <span class="badge bg-success bg-opacity-10 text-success border border-success opacity-75 px-2 py-1">
                                                TP: Rp ${stock.take_profit ? stock.take_profit.toLocaleString('id-ID') : 0}
                                            </span>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Footer Kartu: RSI & Status Akhir -->
                            <div class="pt-2 border-top d-flex justify-content-between align-items-center mt-2">
                                <small class="text-muted fw-semibold">RSI: ${stock.rsi}</small>
                                <span class="badge ${statusBadgeClass} px-2 py-1">
                                    ${stock.overall_status}
                                </span>
                            </div>
                        </div>
                    `;

                    container.appendChild(cardCol);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger shadow-sm">
                            <h5 class="alert-heading">Gagal Memuat Data</h5>
                            <p class="mb-0">${error.message}</p>
                            <hr>
                            <small class="mb-0">Pastikan Anda sudah menjalankan <code>python screener.py</code> dan membuka proyek melalui web server (misal Live Server di VS Code / <code>python -m http.server</code>).</small>
                        </div>
                    </div>`;
                statusInfo.innerText = "Terjadi kesalahan saat memuat data.";
            }
        }

        // Jalankan pemuatan data saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', loadScreenerData);
    </script>
</body>
</html>
