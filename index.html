<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screener Saham - Price Action & RRR</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Style Lokal -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">📈 Stock Screener</span>
            <button class="btn btn-outline-light btn-sm px-3" onclick="loadScreenerData()">🔄 Refresh</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-secondary" id="status-info">Memuat data...</h5>
        </div>

        <!-- Grid Container Utama -->
        <div class="row g-3" id="stock-container">
            <!-- Kartu di-render via JS -->
        </div>
    </div>

    <script>
        async function loadScreenerData() {
            const container = document.getElementById('stock-container');
            const statusInfo = document.getElementById('status-info');
            
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Membaca data.json...</p>
                </div>`;

            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('data.json gagal dimuat');

                const stocks = await response.json();

                if (!stocks || stocks.length === 0) {
                    container.innerHTML = `<div class="col-12"><div class="alert alert-warning text-center">Data kosong. Jalankan screener.py dahulu.</div></div>`;
                    statusInfo.innerText = "Tidak ada data.";
                    return;
                }

                statusInfo.innerText = `Menampilkan ${stocks.length} emiten`;
                container.innerHTML = ''; 

                stocks.forEach(stock => {
                    const cardCol = document.createElement('div');
                    // Memastikan grid 3 kolom di desktop, 2 di tablet, 1 di HP
                    cardCol.className = 'col-12 col-md-6 col-lg-4';

                    let badgeClass = stock.signal === 'BUY' ? 'bg-success' : (stock.signal === 'EXIT' ? 'bg-danger' : 'bg-secondary');

                    cardCol.innerHTML = `
                        <div class="stock-card p-3 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h4 class="fw-bold m-0 text-dark">${stock.ticker || 'UNKNOWN'}</h4>
                                    <span class="fs-5 fw-bold text-primary">Rp ${(stock.price || 0).toLocaleString('id-ID')}</span>
                                </div>

                                <div class="mb-3">
                                    <span class="badge ${badgeClass} badge-pattern text-uppercase">
                                        Pola: ${stock.candle_pattern || 'NEUTRAL'}
                                    </span>
                                </div>

                                ${stock.signal === 'BUY' ? `
                                    <div class="trade-plan-box p-2 mb-3">
                                        <div class="d-flex justify-content-between text-sm mb-1">
                                            <span class="text-secondary">RRR:</span>
                                            <strong class="${stock.valid_rrr ? 'text-success' : 'text-danger'}">
                                                1:${stock.rrr || 0} ${stock.valid_rrr ? '✓' : '✗'}
                                            </strong>
                                        </div>
                                        <div class="d-flex justify-content-between text-sm">
                                            <span class="text-danger">SL: Rp ${(stock.stop_loss || 0).toLocaleString('id-ID')}</span>
                                            <span class="text-success">TP: Rp ${(stock.take_profit || 0).toLocaleString('id-ID')}</span>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="pt-2 border-top d-flex justify-content-between align-items-center mt-2">
                                <small class="text-muted fw-semibold">RSI: ${stock.rsi || 0}</small>
                                <span class="badge bg-dark text-white px-2 py-1">${stock.overall_status || 'NEUTRAL'}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(cardCol);
                });

            } catch (error) {
                container.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error: ${error.message}</div></div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadScreenerData);
    </script>
</body>
</html>
