<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Strategy Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Utama (IHSG Pindah ke Sini) -->
    <header class="main-header">
        <div class="brand-title">IDX ANALYTICS</div>
        <div id="ihsg-header-badge" class="ihsg-compact-badge">
            <span>IHSG</span>
            <span class="value" id="ihsg-val">--</span>
            <span id="ihsg-pct" class="pct">--</span>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Cari emiten...">
        </div>
    </header>

    <!-- Seksi ENTRY (Bekas Slot IHSG Lama) -->
    <section class="entry-container">
        <h3>STRATEGI ENTRY (RSI + EMA CROSS + CANDLE)</h3>
        <div id="entry-list">
            <!-- Rendered via JS -->
        </div>
    </section>

    <!-- Seksi TOP 10 Compact Cards -->
    <section class="top10-container">
        <h3 style="padding: 0 16px;">TOP 10 WATCHLIST</h3>
        <div id="top10-grid" class="top10-grid">
            <!-- Rendered via JS -->
        </div>
    </section>

    <!-- Modal Popup Detail Top 10 -->
    <div id="stock-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-ticker">--</h2>
            <hr style="border-color:#2a2e39;">
            <div id="modal-details"></div>
            <button onclick="closeModal()" style="margin-top:15px; background:#363c4e; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Tutup</button>
        </div>
    </div>

    <script src="indicators.js"></script>
    <script src="app.js"></script>
</body>
</html>
