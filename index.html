<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDX Luxury Screener</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <div class="brand-title">IDX ANALYTICS</div>
        <div class="ihsg-compact-badge">
            <span>IHSG</span>
            <span id="ihsg-val" class="value">-</span>
            <span id="ihsg-pct" class="pct">-</span>
        </div>
        <div style="font-size:12px; color:var(--gold-accent); font-weight:700;" id="total-emiten-count">0 Emiten BEI</div>
    </header>

    <section>
        <h3>Entry Setup Signal</h3>
        <div id="entry-list"></div>
    </section>

    <section>
        <h3>Top 10 Watchlist</h3>
        <div id="top10-grid" class="top10-grid"></div>
    </section>

    <section style="margin-bottom: 40px;">
        <h3>Semua Emiten BEI (120+)</h3>
        <div id="all-stocks-grid" class="top10-grid"></div>
    </section>

    <!-- Modal Detail Emiten -->
    <div id="stock-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 id="modal-ticker" style="margin:0; font-size:18px; color:var(--gold-accent);"></h2>
                <button onclick="closeModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div id="modal-details"></div>
        </div>
    </div>

    <script src="indicators.js"></script>
    <script src="app.js"></script>
</body>
</html>
