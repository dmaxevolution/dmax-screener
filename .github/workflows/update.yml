name: Automatic IDX Screener Update

on:
  schedule:
    # 08:45 - 12:30 WIB (01:45 - 05:30 UTC)
    - cron: '45 1 * * 1-5'
    - cron: '0,15,30,45 2-4 * * 1-5'
    - cron: '0,15,30 5 * * 1-5'
    
    # 13:00 - 16:30 WIB (06:00 - 09:30 UTC)
    - cron: '0,15,30,45 6-8 * * 1-5'
    - cron: '0,15,30 9 * * 1-5'
    
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      # Langsung jalankan screener.py tanpa update.js
      - name: Run Screener Script
        run: python screener.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git status
          git commit -m "Auto-update data.json [skip ci]" || exit 0
          git push
