name: Update IDX PRO Data
on:
  workflow_dispatch:
  schedule:
    # 08:30-11:30 WIB dan 13:00-15:30 WIB, Senin-Jumat (UTC)
    - cron: '30 1-4 * * 1-5'
    - cron: '0,30 6-8 * * 1-5'
    # Final refresh setelah penutupan pasar
    - cron: '10 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: idx-pro-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run Screener
        run: python screener.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json plan_log.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "auto: update IDX PRO data [skip ci]"
          git push origin HEAD:main
