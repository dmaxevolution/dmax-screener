name: Automatic IDX Screener Update

on:
  schedule:
    # Sesi 1 WIB: 08:45 - 12:30 (01:45 - 05:30 UTC)
    - cron: '45 1 * * 1-5'
    - cron: '0,15,30,45 2-4 * * 1-5'
    - cron: '0,15,30 5 * * 1-5'
    
    # Sesi 2 WIB: 13:00 - 16:30 (06:00 - 09:30 UTC)
    - cron: '0,15,30,45 6-8 * * 1-5'
    - cron: '0,15,30 9 * * 1-5'
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run Screener Engine
        run: python screener.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data. Skip push."
          else
            git commit -m "Auto-update data.json [skip ci]"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git push origin HEAD:main || git push origin HEAD:master
          fi
